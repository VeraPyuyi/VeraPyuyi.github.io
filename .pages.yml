media:
  - name: images
    label: 公开图片
    input: public/uploads
    output: /uploads
    rename: safe
    categories: [image]
    extensions: [jpg, jpeg, png, webp, avif]

content:
  - name: blogs
    label: 博客文章
    type: collection
    path: src/content/blogs
    filename: "{routeSlug}-{language}.md"
    view:
      fields: [title, category, language, publishedAt, draft]
      primary: title
      sort: [publishedAt, title]
      default: { sort: publishedAt, order: desc }
    fields:
      - { name: title, label: 标题, type: string, required: true }
      - { name: summary, label: 摘要, type: text, required: true }
      - { name: publishedAt, label: 发布时间, type: date, required: true, description: 北京时间, options: { time: true, format: "yyyy-MM-dd HH:mm:ss" } }
      - { name: updatedAt, label: 更新时间, type: date, default: "", description: 北京时间, options: { time: true, format: "yyyy-MM-dd HH:mm:ss" } }
      - { name: language, label: 语言, type: select, required: true, options: { values: [zh, en] } }
      - { name: translationKey, label: 双语内容 ID, type: string, required: true, description: 同一篇文章的中英文版本填同一个值 }
      - { name: routeSlug, label: 固定链接, type: string, required: true, description: 只用小写字母、数字和连字符，例如 agent-memory-security；中英文版本填同一个值 }
      - { name: category, label: 博客分类, type: select, required: true, options: { values: [inspirations, learning] } }
      - { name: keywords, label: SEO 关键词, type: string, list: true }
      - { name: draft, label: 草稿, type: boolean }
      - { name: featured, label: 首页精选, type: boolean }
      - { name: comments, label: 开启留言, type: boolean }
      - name: cover
        label: 封面
        type: image
        description: 发布（非草稿）时必填
        options: { media: images, path: blogs, rename: safe }
      - { name: coverAlt, label: 封面替代文字, type: string, description: 发布（非草稿）时必填 }
      - { name: order, label: 排序, type: number }
      # Every post has LaTeX ($…$, $$…$$) and tables; a visual editor would escape their _ < > \ and break them,
      # so posts are edited as Markdown source.
      - name: body
        label: 正文（Markdown 源码）
        type: code
        required: true
        description: 数学公式用 $…$ 或 $$…$$
        options: { format: markdown }

  - name: news
    label: 新闻（首页电报）
    type: collection
    path: src/content/news
    filename: "{year}-{month}-{day}-{hour}-{minute}.md"
    view:
      fields: [text, date, draft]
      primary: text
      sort: [date]
      default: { sort: date, order: desc }
    fields:
      - { name: date, label: 时间, type: date, required: true, description: 北京时间；新星会从这一刻起慢慢变暗, options: { time: true, format: "yyyy-MM-dd HH:mm:ss" } }
      - { name: text, label: 内容, type: string, required: true, description: 一句话，像一则电报 }
      - { name: textEn, label: 英文内容（可选）, type: string, description: 留空时英文页显示中文 }
      - { name: href, label: 链接（可选）, type: string, description: 站外链接写完整网址；站内写路径，例如 /papers/xxx }
      - { name: draft, label: 草稿, type: boolean }

  - name: moments
    label: 生活动态
    type: collection
    path: src/content/moments
    filename: "{year}-{month}-{day}-{hour}-{minute}.md"
    view:
      fields: [date, location, draft]
      sort: [date]
      default: { sort: date, order: desc }
    fields:
      - { name: date, label: 时间, type: date, required: true, description: 北京时间, options: { time: true, format: "yyyy-MM-dd HH:mm:ss" } }
      - name: photos
        label: 照片
        type: object
        list:
          collapsible: { collapsed: true, summary: "{alt} ({index})" }
        fields:
          - name: src
            label: 图片
            type: image
            required: true
            options: { media: images, path: moments, rename: safe }
          - { name: alt, label: 替代文字, type: string, required: true }
      - { name: location, label: 地点（可选）, type: string, description: 请勿填写精确位置或私密住址 }
      - { name: language, label: 语言, type: select, options: { values: [zh, en] } }
      - { name: draft, label: 草稿, type: boolean }
      - { name: body, label: 正文, type: rich-text, required: true, options: { format: markdown, switcher: true } }

  - name: albums
    label: 相册
    type: collection
    path: src/content/albums
    filename: "{name}.md"
    view:
      fields: [name, date]
      primary: name
      sort: [date, name]
    fields:
      - { name: name, label: 相册名, type: string, required: true }
      - { name: description, label: 说明, type: text }
      - name: cover
        label: 封面
        type: image
        required: true
        options: { media: images, path: albums, rename: safe }
      - { name: date, label: 拍摄日期, type: date, default: "", description: 北京时间, options: { time: true, format: "yyyy-MM-dd HH:mm:ss" } }
      - { name: language, label: 语言, type: select, options: { values: [zh, en] } }
      - name: photos
        label: 照片
        type: object
        list:
          min: 1
          collapsible: { collapsed: true, summary: "{alt} ({index})" }
        fields:
          - name: src
            label: 图片
            type: image
            required: true
            options: { media: images, path: albums, rename: safe }
          - { name: alt, label: 替代文字, type: string, required: true }
          - { name: date, label: 拍摄日期, type: date, default: "", options: { format: yyyy-MM-dd } }
      - { name: body, label: 相册故事, type: rich-text, options: { format: markdown, switcher: true } }

  - name: site
    label: 站点与导航配置
    type: file
    path: config/site.yaml
    format: code
    operations: { create: false, rename: false, delete: false }

settings:
  content:
    merge: true
  commit:
    templates:
      create: "content: add {filename}"
      update: "content: update {filename}"
      delete: "content: remove {filename}"
      rename: "content: rename {oldFilename} to {newFilename}"
