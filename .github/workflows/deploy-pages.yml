name: Build and deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      ASTRO_TELEMETRY_DISABLED: '1'
      DVISVGM_BIN: ${{ github.workspace }}/.cache/paper-toolchain/bin/dvisvgm
      PUBLIC_GISCUS_REPO: ${{ vars.PUBLIC_GISCUS_REPO }}
      PUBLIC_GISCUS_REPO_ID: ${{ vars.PUBLIC_GISCUS_REPO_ID }}
      PUBLIC_GISCUS_CATEGORY_ID: ${{ vars.PUBLIC_GISCUS_CATEGORY_ID }}
      PUBLIC_GOATCOUNTER_CODE: ${{ vars.PUBLIC_GOATCOUNTER_CODE }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.19.0

      - name: Set up pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 10.28.2
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate content and types
        run: pnpm check

      - name: Set up Pandoc 3.10.2
        uses: pandoc/actions/setup@86321b6dd4675f5014c611e05088e10d4939e09e # v1.1.1
        with:
          version: 3.10.2

      - name: Set up Tectonic 0.17.0
        uses: wtfjoke/setup-tectonic@eb29fd68b7d3f76011906b6e45ea4320c8de5d2f # v4
        with:
          tectonic-version: 0.17.0

      - name: Set up TeX Live 2026
        uses: zauguin/install-texlive@f5e7d0b117035fff797d4392ea94131747e03d60 # v4
        with:
          package_file: texlive-packages.txt
          texlive_version: 2026

      - name: Install dvisvgm build dependency
        run: sudo apt-get update && sudo apt-get install --yes libkpathsea-dev

      - name: Restore locked dvisvgm cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: .cache/paper-toolchain
          key: ${{ runner.os }}-${{ runner.arch }}-dvisvgm-3.6.1-freetype-2.14.3-v1

      - name: Build locked dvisvgm 3.6.1
        run: sh scripts/setup-dvisvgm-3.6.1.sh

      - name: Verify locked paper toolchain
        run: pnpm papers:toolchain

      - name: Run unit tests
        run: pnpm test

      - name: Compile LaTeX to PDF and HTML
        run: node scripts/build-papers.mjs --strict

      - name: Build optimized images
        run: node scripts/optimize-images.mjs

      - name: Build Astro and Pagefind
        run: pnpm astro build

      - name: Check generated links and required output
        run: pnpm check:output

      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5
